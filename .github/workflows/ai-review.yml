name: AI Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

# A new push cancels the review still running for the same PR.
concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# Read the code, write review comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Skip drafts, and fork PRs: GitHub withholds secrets from them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Check API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY repository secret to enable AI review."
            exit 1
          fi

      # For pull_request events this checks out the PR merged into its base,
      # so search_code and read_file see the code being reviewed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Review PR and post comments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew :review-agent:run --args="$PR_NUMBER --post"

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-pr-${{ env.PR_NUMBER }}-${{ github.run_attempt }}
          path: review-agent/runs/
          if-no-files-found: ignore
